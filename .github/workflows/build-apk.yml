name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'index.html'
      - 'privacy.html'
      - '404.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'release-info.json'
      - 'hosting/**'
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish release (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Firebase google-services.json if provided via secret
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GS_JSON" ]; then
              printf '%s\n' "$GS_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            elif [ -n "$GS_JSON_B64" ]; then
              printf '%s' "$GS_JSON_B64" | base64 -d > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
            else
              echo "WARNING: app/google-services.json not found in repo or secrets; building without Firebase client config."
            fi
          fi

      - name: Materialize signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          REL_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.STORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$REL_KEYSTORE_B64" ] && [ -n "$STORE_PW" ] && [ -n "$KEY_PW" ]; then
            printf '%s' "$REL_KEYSTORE_B64" | base64 -d > my-upload-key.jks
            echo "BUILD_MODE=release" >> "$GITHUB_ENV"
            echo "Restored release upload keystore from secrets."
          else
            echo "BUILD_MODE=debug" >> "$GITHUB_ENV"
            if [ ! -f debug.keystore ]; then
              if [ -n "$KEYSTORE_B64" ]; then
                printf '%s' "$KEYSTORE_B64" | base64 -d > debug.keystore
                echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
              elif [ -f debug.keystore.base64 ]; then
                base64 -d debug.keystore.base64 > debug.keystore
                echo "Restored debug.keystore from debug.keystore.base64."
              else
                keytool -genkeypair -v -keystore debug.keystore \
                  -storepass android -alias androiddebugkey -keypass android \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -dname "CN=Android Debug,O=Android,C=US"
                echo "Generated CI fallback debug.keystore."
              fi
            fi
            keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:" || true
          fi

      - name: Build installable Android APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Package and verify helicopter-war.apk
        run: |
          mkdir -p dist-apk
          if [ "$BUILD_MODE" = "release" ]; then
            cp app/build/outputs/apk/release/*.apk dist-apk/helicopter-war.apk
          else
            cp app/build/outputs/apk/debug/*.apk dist-apk/helicopter-war.apk
          fi
          test -s dist-apk/helicopter-war.apk
          ls -lh dist-apk/helicopter-war.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helicopter-war-apk
          path: dist-apk/helicopter-war.apk
          if-no-files-found: error

      - name: Resolve release tag
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -n "$VERSION_NAME" ]; then
              echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish GitHub Release APK
        if: steps.release_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Helicopter War ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: dist-apk/helicopter-war.apk

      - name: Auto-update website, README, and sitemap with verified release
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --rebase origin main || true
          python3 .github/scripts/update-release-metadata.py "${{ steps.release_meta.outputs.tag }}" dist-apk/helicopter-war.apk
          git add README.md index.html hosting/index.html release-info.json hosting/release-info.json sitemap.xml hosting/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update site and README for ${{ steps.release_meta.outputs.tag }} [skip ci]"
            git push origin main
          fi
