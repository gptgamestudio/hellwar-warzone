name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'index.html'
      - 'privacy.html'
      - '404.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'release-info.json'
      - 'app-ads.txt'
      - 'hosting/**'
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish release (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Firebase google-services.json if provided via secret
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GS_JSON" ]; then
              printf '%s\n' "$GS_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            elif [ -n "$GS_JSON_B64" ]; then
              printf '%s' "$GS_JSON_B64" | base64 -d > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
            else
              echo "::error::Missing app/google-services.json in repo and secrets (GOOGLE_SERVICES_JSON or GOOGLE_SERVICES_JSON_BASE64)."
              exit 1
            fi
          fi

      - name: Materialize production release keystore
        env:
          REL_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.STORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$REL_KEYSTORE_B64" ] || [ -z "$STORE_PW" ] || [ -z "$KEY_PW" ]; then
            echo "::error::Missing required production release secrets: RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD are all mandatory (debug keystore fallback is disabled)."
            exit 1
          fi
          printf '%s' "$REL_KEYSTORE_B64" | base64 -d > my-upload-key.jks
          keytool -list -v -keystore my-upload-key.jks -alias upload -storepass "$STORE_PW" | grep -E "Alias name:|SHA1:|SHA256:"
          echo "Verified production upload keystore."

      - name: Run unit tests
        run: |
          gradle clean :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed production release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_PATH="$PWD/my-upload-key.jks"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Package and verify signed helicopter-war.apk
        run: |
          mkdir -p dist-apk
          APK_SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)
          if [ -z "$APK_SRC" ] || [ ! -s "$APK_SRC" ]; then
            echo "::error::Signed release APK not found in app/build/outputs/apk/release."
            exit 1
          fi
          cp "$APK_SRC" dist-apk/helicopter-war.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(command -v apksigner || find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs dist-apk/helicopter-war.apk
          ls -lh dist-apk/helicopter-war.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helicopter-war-apk
          path: dist-apk/helicopter-war.apk
          if-no-files-found: error

      - name: Resolve release tag
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -n "$VERSION_NAME" ]; then
              echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish GitHub Release APK
        if: steps.release_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Helicopter War ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: dist-apk/helicopter-war.apk

      - name: Auto-update website, README, and sitemap with verified release
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          cp dist-apk/helicopter-war.apk "$RUNNER_TEMP/helicopter-war.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python3 .github/scripts/update-release-metadata.py "${{ steps.release_meta.outputs.tag }}" "$RUNNER_TEMP/helicopter-war.apk"
          git add README.md index.html hosting/index.html release-info.json hosting/release-info.json sitemap.xml hosting/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update site and README for ${{ steps.release_meta.outputs.tag }} [skip ci]"
            git push origin main
          fi
