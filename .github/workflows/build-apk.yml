name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Materialize debug signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build signed APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Package standardized helicopter-war.apk
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/*.apk dist-apk/helicopter-war.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helicopter-war-apk
          path: dist-apk/helicopter-war.apk
          if-no-files-found: error

      - name: Publish GitHub Release APK on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/helicopter-war.apk
